services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    working_dir: /app
    command: >-
      sh -c '
      test -f .env || cp .env.example .env;
      composer install --no-interaction --no-progress;
      grep -q "^APP_KEY=." .env || php artisan key:generate --force;
      php artisan migrate --seed --force;
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      '
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-pdkb}
      DB_USERNAME: ${POSTGRES_USER:-pdkb}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pdkb_dev}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdkb}
      POSTGRES_USER: ${POSTGRES_USER:-pdkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdkb_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
